<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <form id="createProductForm" class="form-group" action="">
        <input type="number" name="id" id="productId" />
        <input type="text" name="title" id="product-title">
        <input type="number" name="price" id="product-price">
        <input type="text" name="description" id="product-description">
        <input type="text" name="category" id="product-category">
        <input type="text" name="image" id="product-image">

        <button type="submit">Create Product</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./CreateProduct.js"></script>
  </body>
</html>
