<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .product-container {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 30px;
        margin-top: 30px;
        margin-bottom: 30px;
      }

      .product-image {
        width: 100%;
        height: 400px;
        object-fit: cover;
        border-radius: 8px;
        background-color: #e9ecef;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #999;
      }

      .product-title {
        font-size: 28px;
        font-weight: 600;
        margin: 20px 0;
        color: #212529;
      }

      .product-rating {
        margin-bottom: 15px;
      }

      .stars {
        color: #ffc107;
        font-size: 18px;
        margin-right: 10px;
      }

      .reviews-count {
        color: #6c757d;
        font-size: 14px;
      }

      .product-price {
        font-size: 32px;
        font-weight: 700;
        color: #28a745;
        margin: 20px 0;
      }

      .product-description {
        color: #495057;
        line-height: 1.6;
        margin-bottom: 20px;
        font-size: 15px;
      }

      .product-specs {
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
      }

      .spec-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #dee2e6;
      }

      .spec-item:last-child {
        border-bottom: none;
      }

      .spec-label {
        font-weight: 500;
        color: #495057;
      }

      .spec-value {
        color: #212529;
        font-weight: 600;
      }

      .quantity-section {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 25px 0;
      }

      .quantity-label {
        font-weight: 500;
        color: #495057;
      }

      .quantity-control {
        display: flex;
        align-items: center;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        overflow: hidden;
      }

      .quantity-btn {
        background-color: #f8f9fa;
        border: none;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 18px;
        transition: background-color 0.2s;
      }

      .quantity-btn:hover {
        background-color: #e9ecef;
      }

      .quantity-input {
        border: none;
        width: 60px;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
      }

      .quantity-input:focus {
        outline: none;
      }

      .action-buttons {
        display: flex;
        gap: 15px;
        margin-top: 30px;
      }

      .btn-add-cart {
        flex: 1;
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .btn-add-cart:hover {
        background-color: #0056b3;
      }

      .btn-wishlist {
        background-color: white;
        border: 2px solid #dee2e6;
        color: #495057;
        padding: 12px 20px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-wishlist:hover {
        border-color: #ff6b6b;
        color: #ff6b6b;
      }

      .availability {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .availability.in-stock {
        background-color: #d4edda;
        color: #155724;
      }

      .availability.out-stock {
        background-color: #f8d7da;
        color: #721c24;
      }

      @media (max-width: 768px) {
        .product-container {
          padding: 15px;
        }

        .product-title {
          font-size: 22px;
        }

        .product-price {
          font-size: 24px;
        }

        .action-buttons {
          flex-direction: column;
        }

        .quantity-section {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="product-container">
        <div class="row">
          <!-- Product Image -->
          <div class="col-lg-6 col-md-6 col-sm-12">
            <img id="product-image" class="product-image" src="https://via.placeholder.com/400" alt="Product" />
          </div>

          <!-- Product Info -->
          <div class="col-lg-6 col-md-6 col-sm-12">
            <h1 class="product-title" id="product-title">Product Name</h1>

            <!-- Rating -->
            <div class="product-rating">
              <span class="stars" id="product-stars">★★★★★</span>
              <span class="reviews-count" id="product-reviews">(0 reviews)</span>
            </div>

            <!-- Availability -->
            <div id="availability" class="availability in-stock">In Stock</div>

            <!-- Price -->
            <div class="product-price" id="product-price">$0.00</div>

            <!-- Description -->
            <p class="product-description" id="product-description">
              Product description will appear here...
            </p>

            <!-- Specifications -->
            <div class="product-specs">
              <div class="spec-item">
                <span class="spec-label">Category:</span>
                <span class="spec-value" id="product-category">Electronics</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Brand:</span>
                <span class="spec-value" id="product-brand">Brand Name</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">SKU:</span>
                <span class="spec-value" id="product-sku">SKU123</span>
              </div>
              <div class="spec-item">
                <span class="spec-label">Stock:</span>
                <span class="spec-value" id="product-stock">0</span>
              </div>
            </div>

            <!-- Quantity Selector -->
            <div class="quantity-section">
              <label class="quantity-label">Quantity:</label>
              <div class="quantity-control">
                <button class="quantity-btn" id="qty-decrease">−</button>
                <input type="number" class="quantity-input" id="quantity" value="1" min="1" />
                <button class="quantity-btn" id="qty-increase">+</button>
              </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
              <button class="btn-add-cart" id="add-to-cart-btn">Add to Cart</button>
              <button class="btn-wishlist" id="wishlist-btn">♡ Wishlist</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./productDetails.js"></script>
  </body>
</html>
